apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: alloy
  namespace: observability

spec:
  selector:
    matchLabels:
      app: alloy

  template:
    metadata:
      labels:
        app: alloy

    spec:
      serviceAccountName: alloy

      containers:
        - name: alloy
          image: grafana/alloy:latest

          args:
            - run
            - /etc/alloy/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data

          ports:
            - name: http
              containerPort: 12345

          volumeMounts:
            - name: config
              mountPath: /etc/alloy

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: alloy-data
              mountPath: /var/lib/alloy/data

      volumes:
        - name: config
          configMap:
            name: alloy-config

        - name: varlog
          hostPath:
            path: /var/log
            type: Directory

        - name: alloy-data
          hostPath:
            path: /var/lib/alloy
            type: DirectoryOrCreate
