services:

  # ==========================================================
  # NODE EXPORTER
  # ==========================================================

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped

    pid: host

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'

    ports:
      - "9100:9100"

    networks:
      - default
      - observability


  # ==========================================================
  # PROMETHEUS
  # ==========================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
      - ./prometheus/kubernetes/token:/etc/prometheus/secrets/kubernetes_token:ro

    depends_on:
      - node-exporter
      - alertmanager

    networks:
      - observability


  # ==========================================================
  # ALERTMANAGER
  # ==========================================================

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

    networks:
      - observability
      - default

  # ==========================================================
  # GRAFANA
  # ==========================================================

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "mailpit:1025"
      GF_SMTP_USER: ""
      GF_SMTP_PASSWORD: ""
      GF_SMTP_FROM_ADDRESS: "grafana@observability.local"
      GF_SMTP_FROM_NAME: "Grafana"
      GF_SMTP_STARTTLS_POLICY: "NoStartTLS"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus
      - mailpit

    networks:
      - default
      - observability


  # ==========================================================
  # MAILPIT
  # ==========================================================

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    restart: unless-stopped

    ports:
      - "8025:8025"

    networks:
      - default
      - observability


# ============================================================
# VOLUMES
# ============================================================

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:


# ============================================================
# NETWORKS
# ============================================================

networks:
  observability:
    external: true
