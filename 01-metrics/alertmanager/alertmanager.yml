global:
  smtp_smarthost: "mailpit:1025"
  smtp_from: "alertmanager@observability.local"


route:
  receiver: "default-email"

  group_by:
    - alertname
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:

    - matchers:
        - severity="critical"
      receiver: "critical-email"

    - matchers:
        - severity="warning"
      receiver: "warning-email"


receivers:

  - name: "default-email"
    email_configs:
      - to: "admin@observability.local"
        require_tls: false
        send_resolved: true

  - name: "critical-email"
    email_configs:
      - to: "critical@observability.local"
        require_tls: false
        send_resolved: true

  - name: "warning-email"
    email_configs:
      - to: "warning@observability.local"
        require_tls: false
        send_resolved: true

inhibit_rules:

  - source_matchers:
      - category="infrastructure"
      - severity="critical"

    target_matchers:
      - category="infrastructure"
      - severity="warning"

    equal:
      - instance
